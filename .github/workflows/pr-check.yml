name: PR or push to github
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: 'bash'

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run Playwright smoke tests in Docker
        run: docker compose --profile smoke run --rm smoke-tests
        env:
          PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TOKEN_EP: ${{ vars.TOKEN_EP }}
          DASHBOARD_PICTURE_URL: ${{ vars.DASHBOARD_PICTURE_URL }}
          ABOUT_URL: ${{ vars.ABOUT_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-results/junit.xml
          retention-days: 14

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results/junit.xml
